name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - name: Validate composer.json
        run: composer validate --strict
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -t php -l
      - name: Smoke test (échoue sur tout Deprecated/Warning/Notice)
        run: php -d error_reporting=E_ALL tests/smoke.php
